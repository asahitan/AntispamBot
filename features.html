<title>See what it does — AntiSpam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1417; --panel:#161C20; --panel-2:#1B2226; --line:#2A343A;
    --text:#E8EDEF; --muted:#8A969C;
    --ok:#33D17A; --warn:#F5B942; --block:#FF5D5D;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:inherit;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1.6;min-height:100dvh;display:flex;flex-direction:column;}
  header{flex-shrink:0;}
  footer{flex-shrink:0;}
  main{flex:1 0 auto;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-0.01em;}
  a{color:inherit;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px;}
  header{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:70;background:var(--bg);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:11px 32px;max-width:1280px;margin:0 auto;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
  .brand-logo{width:20px;height:20px;flex-shrink:0;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .nav-links{display:flex;align-items:center;gap:20px;}
  .nav-links a{font-size:13px;color:var(--muted);text-decoration:none;}
  .nav-links a:hover{color:var(--text);}
  @media (max-width:480px){.nav-links{gap:14px;}}
  .btn{display:inline-block;background:var(--ok);color:#08130D;font-weight:600;font-family:'Space Grotesk',sans-serif;text-decoration:none;padding:10px 18px;border-radius:4px;font-size:14px;}
  .btn:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}

  .hero{padding:72px 0 48px;border-bottom:1px solid var(--line);}
  .hero-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;align-items:start;}
  @media (max-width:820px){.hero-grid{grid-template-columns:1fr;}}
  h1.headline{font-size:44px;line-height:1.12;font-weight:700;}
  @media (max-width:520px){h1.headline{font-size:32px;}}
  .sub{color:var(--muted);font-size:15.5px;margin-top:18px;max-width:46ch;}
  .hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}

  .console{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .console-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;}
  .console-body{padding:18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .stat .n{font-size:26px;font-weight:600;font-family:'Space Grotesk',sans-serif;}
  .stat .l{color:var(--muted);font-size:12px;margin-top:2px;}
  .stat.ok .n{color:var(--ok);}
  .stat.bad .n{color:var(--block);}
  .stat.warn .n{color:var(--warn);}
  .status-line{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;}
  .status-live{color:var(--ok);}
  .status-off{color:var(--muted);}

  section{padding:56px 0;border-bottom:1px solid var(--line);}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
  .section-head h2{font-size:24px;}
  .section-head p{color:var(--muted);font-size:13.5px;margin:0;}

  .modules{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  @media (max-width:760px){.modules{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.modules{grid-template-columns:1fr;}}
  .module{background:var(--panel);padding:20px;}
  .module .tag{color:var(--ok);font-size:12px;word-break:break-word;}
  .module h3{font-size:15.5px;margin:8px 0 8px;}
  .module p{color:var(--muted);font-size:13px;margin:0;}

  .note{color:var(--muted);font-size:13.5px;margin:0 0 20px;max-width:72ch;}
  .note code{color:var(--ok);}
  .cmdtable-scroll{overflow-x:auto;}
  .cmdtable{width:100%;min-width:480px;border-collapse:collapse;font-size:13.5px;}
  .cmdtable th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);}
  .cmdtable td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  .cmdtable code{color:var(--ok);}
  .cmdtable tr:last-child td{border-bottom:none;}

  .menu-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;flex-shrink:0;}
  .menu-btn:hover{background:var(--panel);}
  .menu-btn:focus-visible{outline:2px solid var(--ok);outline-offset:2px;}

  .dropdown-wrap{position:relative;}
  .dropdown-menu{position:absolute;top:calc(100% + 10px);right:0;left:auto;width:230px;max-width:calc(100vw - 28px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.45);padding:6px;z-index:61;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .16s ease,transform .16s ease;}
  .dropdown-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  @media (prefers-reduced-motion:reduce){.dropdown-menu{transition:none;}}

  .dropdown-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;}
  .dropdown-item:hover{background:var(--panel-2);}
  .dropdown-item .ic{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--panel-2);color:var(--ok);flex-shrink:0;}
  .dropdown-item:hover .ic{background:var(--bg);}
  .dropdown-divider{height:1px;background:var(--line);margin:6px 4px;}

  footer{border-top:1px solid var(--line);}
  .foot{padding:36px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;text-align:center;}
  .foot-links{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
  .foot-links a{color:var(--muted);text-decoration:none;}
  .foot-links a:hover{color:var(--text);text-decoration:underline;}
  .foot-sep{color:var(--line);}
  @media (prefers-reduced-motion:no-preference){
    .stat .n{transition:opacity .3s ease;}
  }
  @media (max-width:480px){
    .wrap{padding:0 18px;}
    .nav{padding:9px 18px;}
    .console-body{gap:14px 10px;}
  }
  @media (max-width:360px){
    .console-body{grid-template-columns:1fr;}
    .stat .n{font-size:22px;}
  }

  .docs{display:grid;grid-template-columns:300px minmax(0,1fr);}
  .docs-side{position:sticky;top:var(--hdr,55px);align-self:start;max-height:calc(100dvh - var(--hdr,55px));overflow-y:auto;padding:16px 16px 24px;}
  .docs-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;padding:0 12px;}
  .docs-quick{display:block;width:100%;margin-top:16px;text-align:left;background:rgba(51,209,122,.08);border:1px solid transparent;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:15px;padding:9px 14px;border-radius:12px;cursor:pointer;}
  .docs-quick:hover{background:rgba(51,209,122,.13);}
  .docs-quick.active{border-color:rgba(51,209,122,.45);}
  .docs-div{border-top:1px dashed var(--line);margin:14px -16px 10px;}
  .docs-side:has(.docs-group-btn[aria-expanded="false"]){padding-bottom:10px;}
  .docs-group-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:15px;padding:7px 14px;cursor:pointer;text-align:left;border-radius:10px;}
  .docs-group-btn:hover{background:var(--panel);}
  .docs-group-btn .caret{transition:transform .2s ease;flex-shrink:0;}
  .docs-group-btn[aria-expanded="false"] .caret{transform:rotate(180deg);}
  .docs-group-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-left:12px;}
  .docs-group-list[hidden]{display:none;}
  .docs-item{position:relative;display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:15.5px;padding:10px 12px 10px 16px;border-radius:8px;cursor:pointer;}
  .docs-item:hover{color:var(--text);background:var(--panel);}
  .docs-item.active{color:var(--text);background:var(--panel-2);}
  .docs-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:2px;background:var(--ok);}
  .docs-item:focus-visible,.docs-group-btn:focus-visible,.docs-quick:focus-visible,.toc-btn:focus-visible,.copy-main:focus-visible,.copy-caret:focus-visible{outline:2px solid var(--ok);outline-offset:2px;}

  .docs-main{min-width:0;border-left:1px solid var(--line);}
  .docs-bar{position:sticky;top:var(--hdr,55px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);}
  .toc-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:0;color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;padding:14px 32px;cursor:pointer;text-align:left;}
  .toc-btn .chev{transition:transform .2s ease;flex-shrink:0;}
  .toc-btn[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .toc-list{display:none;position:absolute;left:0;right:0;top:100%;background:var(--panel);border-bottom:1px solid var(--line);max-height:min(60vh,420px);overflow-y:auto;padding:8px 20px 12px;box-shadow:0 16px 30px rgba(0,0,0,.35);}
  .toc-list.open{display:block;}
  .toc-list button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-size:15px;padding:8px 12px;border-radius:8px;cursor:pointer;}
  .toc-list button:hover{color:var(--text);background:var(--panel-2);}

  .docs-article{padding:18px 20px 26px;max-width:1080px;}
  .docs-h{font-size:clamp(32px,5.5vw,56px);line-height:1.1;font-weight:700;}
  .docs-sub{color:var(--muted);font-size:16px;margin:16px 0 28px;max-width:62ch;}
  .copy-wrap{position:relative;display:inline-flex;margin:0 0 32px;}
  .copy-pill{display:inline-flex;align-items:stretch;background:var(--panel-2);border-radius:999px;overflow:hidden;}
  .copy-main,.copy-caret{background:transparent;border:0;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:16px;cursor:pointer;}
  .copy-main{padding:13px 12px 13px 24px;font-weight:500;}
  .copy-caret{padding:0 20px 0 10px;display:flex;align-items:center;}
  .copy-main:hover,.copy-caret:hover{background:rgba(255,255,255,.05);}
  .copy-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.45);padding:6px;z-index:8;display:none;}
  .copy-menu.open{display:block;}
  .copy-menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14.5px;padding:9px 12px;border-radius:8px;cursor:pointer;}
  .copy-menu button:hover{background:var(--panel-2);}

  .info{border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin:0 0 36px;}
  .info-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin:0 0 14px;}
  .info-row{display:flex;gap:14px;align-items:flex-start;color:var(--text);font-size:14.5px;}
  .info-row svg{flex-shrink:0;margin-top:3px;}
  .info-row p{margin:0;}
  .info code,.body code{color:var(--ok);}
  .sec-h{font-size:22px;margin:36px 0 10px;}
  .body{margin:0 0 8px;font-size:14.5px;max-width:72ch;}
  .body a{color:var(--ok);}
  .docs-main h3{scroll-margin-top:calc(var(--hdr,55px) + 76px);}
  .pane[hidden]{display:none;}
  .docs-article .note{margin-bottom:20px;}
  @media (max-width:1100px){.modules{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:860px){
    .docs{grid-template-columns:1fr;}
    .docs-side{position:static;max-height:none;border-bottom:1px solid var(--line);padding:14px 14px 10px;}
    .docs-main{border-left:0;}
    .docs-quick{margin-top:14px;}
    .docs-group-btn{padding-left:6px;padding-right:6px;}
    .docs-group-btn .caret{margin-right:2px;}
    .toc-btn{padding:14px 20px;}
    .docs-article{padding:12px 12px 22px;}
  }
  @media (max-width:520px){.modules{grid-template-columns:1fr;}}

  .sec-list{margin:8px 0 8px;padding-left:22px;max-width:78ch;font-size:14.5px;}
  .sec-list li{margin:9px 0;padding-left:4px;}
  .sec-list li::marker{color:var(--muted);}
  .sec-list code{color:var(--ok);}
  .sec-list a,.docs-sub a,.info a{color:var(--ok);}
  .docs-sub code,.body code{color:var(--ok);}
  .docs-side{scroll-behavior:auto;}
</style>
</head>
<body>

<script>
const API_BASE = "https://antispam-relay.onrender.com";
const DATA = {"quick": {"id": "quickstart", "name": "Quickstart", "title": "Quickstart", "sub": "Add AntiSpam to your server and set up your first feature.", "who_title": "Who can use this feature?", "who": "`/configure` is for Administrators. Features marked “owner only” are shown to the server owner.", "sections": [{"h": "Add AntiSpam to your server", "p": ["Use the [Add to server](https://discord.com/oauth2/authorize?client_id=1091852954069381200) link to invite the bot. Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}, {"h": "Open the dashboard", "p": ["Run `/configure`. It opens a dashboard that only you can see (Administrator only)."]}, {"h": "Turn on a feature", "p": ["Pick a feature from the menu and change its settings with buttons and menus. Each feature works on its own, so turn on only what your server needs. Choose a feature in the sidebar to see how it works and how to use it."]}, {"h": "Get help", "p": ["Run `/help` to get help, with a category for each feature."]}]}, "pages": [{"id": "antispam", "name": "Anti-Spam", "title": "Anti-Spam", "sub": "Detects message flooding, deletes it, and punishes the spammer the way you choose.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Administrators and whitelisted members are never checked.", "sections": [{"h": "How it works", "ul": ["AntiSpam counts each member's messages. More than **5 messages within 10 seconds** counts as spam.", "It deletes that member's recent messages in the channel (the last 30 seconds), then applies the punishment you picked.", "The punishment can be **Kick**, **Ban**, **Delete Message**, **Timeout** or **Warn**.", "Administrators, whitelisted roles and whitelisted members bypass it."]}, {"h": "How to use it", "p": ["Open `/configure` → **Anti-Spam**."], "ul": ["**Where should it apply?** - `Server-wide` applies the settings to all channels. `This channel only` applies them only to the channel where you opened `/configure`.", "**Choose a punishment** - Kick, Ban, Delete Message, Timeout or Warn.", "**Enable / Disable** - Turn protection on or off for the place you picked. Your choices are not saved until you press **Enable**.", "**Timeout length** - Only used with the `Timeout` punishment. Leave it blank for the default of **7 days**. Discord allows between 1 minute and 28 days.", "**Whitelist** - Pick roles and members that bypass anti-spam, and remove them again. The page lists the current whitelist.", "**Log channel** - Choose the channel for anti-spam logs, or press **Remove log channel**."]}, {"h": "Check the status", "p": ["`/antispam status` shows the anti-spam status for the server and channels."]}, {"h": "Notes", "ul": ["A punishment is **required to enable** anti-spam. Pick one, or it won't take any action when it catches spam.", "A punishment is **not needed to disable** anti-spam.", "The **Warn** punishment adds to the member's warning count. By default **6 warnings** cause an automatic softban (removed, not permanently banned). Change the steps in `/configure` → **Warn Escalation**.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "guard", "name": "Guard", "title": "Guard", "sub": "Anti-nuke and anti-raid protection that rebuilds what an attacker deletes.", "who_title": "Who can use this feature?", "who": "The server owner, and co-owners the owner gave Guard to. Guard is off until one of them turns it on in `/configure`.", "sections": [{"h": "How it works", "p": ["**Guard** protects your server from **raids and nukes**: mass channel or role deletion, mass bans, unauthorized bots and waves of new accounts. If something does get deleted, it rebuilds it."], "ul": ["**Mass deletion** - An untrusted user who deletes 3 channels or 3 roles within 10 seconds loses all their roles (a bot is kicked). Everything deleted is rebuilt automatically.", "**Mass bans** - 5 bans within 10 seconds by an untrusted user are undone and that user loses their roles.", "**Channel spam** - 5 channels created within 10 seconds by an untrusted user are deleted.", "**Unauthorized bots** - If an untrusted member adds a bot with dangerous permissions, the bot is kicked and the member who added it loses their roles. To let an admin add such bots, add them to the **Trusted list** and Guard skips this check for them.", "**Join raids** - 5 or more accounts joining within 10 seconds are kicked.", "**Auto restore** - Deleted roles, categories, channels, permissions and recent text messages are rebuilt, and your AntiSpam settings (honeypot, logs, whitelists) are re-linked to the new channels."]}, {"h": "Quick setup", "ol": ["Move **AntiSpam**'s role to the **top** of the role list and give it **Administrator**.", "Run `/configure` and pick **Guard (owner & co-owners)**.", "Choose a log channel like `#security-logs`.", "Trust every real admin and every other moderation bot you use.", "Press **Enable Guard**.", "Check the page's **Status**, or run `/guard status`, to make sure nothing is wrong."]}, {"h": "On the Guard page", "ul": ["**Enable Guard / Disable Guard** - Turn Guard on (this also saves the first backup) or off. Turning it off asks for the password first if one is set.", "**Trusted list** - With the dropdowns, pick an admin or bot for Guard to ignore, or remove someone from the trusted list again.", "**Log channel** - Choose where Guard reports what it does.", "**Backup now** - Save a backup of roles, channels and recent messages now. This replaces the saved backup, so if a password is set, it is asked first.", "**Restore from backup** - Rebuild anything that was deleted, from the latest backup. If a password is set, it is asked first.", "**Delete backup** - Delete the saved backup. If a password is set, it is asked first.", "**Password** - *(server owner only, optional)* You don't have to set one. It protects **Disable Guard**, **Backup now**, **Restore from backup** and **Delete backup**. Automatic backups and auto-restore never need it. Use a new password made only for this, never the one for your email, Discord or other accounts, and save it somewhere safe. If you forget it, **Forgot password** lets you pick a new one by typing the recovery answer you set with the password."]}, {"h": "Check the status", "p": ["`/guard status` shows if Guard is on, who is trusted, the last backup and any problems."]}, {"h": "Notes", "ul": ["The server owner and every co-owner are always trusted, whatever pages they have. **Trust your other admins**, or their mass actions count as attacks.", "A single deletion is never punished, only mass actions.", "A backup is saved every 10 minutes. Backups pause for 10 minutes after an attack so the damage is never saved.", "Restored messages are text only (images and embeds can't be brought back), and edits like renames are not undone.", "Guard can't punish anyone whose role is above AntiSpam's role.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "shield", "name": "Raid Shield", "title": "Raid Shield", "sub": "Stops bot raids, even when the spam is hidden inside forwarded messages.", "who_title": "Who can use this feature?", "who": "The server owner, and co-owners the owner gave Raid Shield to. The shield is off until one of them turns it on in `/configure`.", "sections": [{"h": "How it works", "p": ["**Raid Shield** stops **bot raids**: several bots join and all post the same message over and over. It also catches bots that hide the spam inside **forwarded messages**, which look empty to normal spam filters."], "ul": ["**Detects** 3 or more different bots posting the same message within 30 seconds, or one bot repeating it 6 times within 15 seconds. Forwarded messages are compared by their hidden text, attachments, embeds and stickers.", "**Times out** every bot involved for **1 hour**.", "**Deletes** their spam, and anything they still manage to post while timed out.", "**Reports** the raid in your log channel with the bots, how many messages were deleted and when the timeouts end."]}, {"h": "Quick setup", "ol": ["Move **AntiSpam**'s role **above** the bots you want to watch, with **Moderate Members**, **Manage Messages**, **Kick Members** and **Ban Members** (or just **Administrator**).", "Run `/configure`, pick **Raid Shield (owner & co-owners)** and choose a report channel like `#security-logs`.", "Exempt every bot you trust, like music or ticket bots.", "Press **Enable Shield**.", "Check the page's **Status**, or run `/shield status`, to make sure nothing is wrong, and press **Preview a raid report** to see a report."]}, {"h": "On the Raid Shield page", "ul": ["**Enable Shield / Disable Shield** - Turn the shield on or off.", "**Report channel** - Choose where raid reports are posted.", "**Exempt bots** - With the dropdowns, pick a bot the shield never flags (this also lifts its timeout), or put a bot back under watch.", "**Preview a raid report** - Show a sample report. Nothing is touched and only you see it."]}, {"h": "Raid report buttons", "p": ["Available to the server owner, and co-owners with Raid Shield access."], "ul": ["**Allow** - Lifts the timeout and exempts the bots from the shield.", "**Kick** - Removes the bots from the server.", "**Ban** - Bans the bots and deletes their last hour of messages.", "A button applies to **all bots in that report**. To keep only one bot, exempt it on the Raid Shield page in `/configure` before choosing Kick or Ban.", "If you don't choose, the bots simply stay timed out until the hour ends."]}, {"h": "Check the status", "p": ["`/shield status` shows if the shield is on, the log channel, exempt bots and any problems."]}, {"h": "Notes", "ul": ["It only watches **bots**. Humans, the server owner, AntiSpam, your whitelisted bots and bots trusted in Guard are never flagged.", "If no log channel is set, reports go to the Guard log channel, then the system channel, then the owner's DMs.", "A bot with **Administrator** or a role above AntiSpam's can't be timed out. The report and `/shield status` tell you when that happens.", "The first few spam messages can appear before the shield reacts. They are deleted right after.", "Buttons keep working after a restart, and reports stay available for 14 days.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "antibot", "name": "Anti-Bot", "title": "Anti-Bot", "sub": "Watches for malicious bots and mass bot joins, and blocks them automatically.", "who_title": "Who can use this feature?", "who": "The server owner, and co-owners the owner gave Anti-Bot to.", "sections": [{"h": "How it works", "ul": ["Automatic malicious bot detection and blocking.", "Real-time threat monitoring and analysis.", "Mass bot join prevention.", "Suspicious account pattern recognition.", "Protection applies server-wide when enabled."]}, {"h": "How to use it", "p": ["Open `/configure` → **Anti-Bot (owner & co-owners)**. Only the server owner and co-owners the owner gave Anti-Bot to see this option."], "ul": ["**Enable / Disable Anti-Bot** - Turn protection on or off.", "**Log channel** - Choose the log channel in the dropdown, or press **Remove log channel**."]}, {"h": "Notes", "ul": ["A **log channel** is critical for security monitoring. Without logging, you won't know when threats are blocked.", "Bots that Anti-Bot kicks are reported in the Anti-Bot log, not in the Join Logs channel.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "captcha", "name": "CAPTCHA Verification", "title": "CAPTCHA Verification", "sub": "Requires new members to verify before they can talk, cutting down bot joins.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`.", "sections": [{"h": "How it works", "ul": ["New members are given the **Unverified** role (you can rename it) on join and can only see the **#captcha** channel.", "In **#captcha** they are pinged with a **Start Verification** button to get a CAPTCHA.", "Every role you add is given to a member the moment they pass verification, not just the first one.", "Enabling CAPTCHA immediately creates the **#captcha** channel and **Unverified** role, so it's ready before anyone joins."]}, {"h": "How to use it", "p": ["Open `/configure` → **CAPTCHA Verification**."], "ul": ["**Enable / Disable CAPTCHA** - Turn CAPTCHA on or off.", "**Add roles** - Pick one or more roles (up to 10 at a time) to give on verification. You can add as many as you like over time.", "**Remove role** - Pick a role to stop giving out.", "**Clear roles** - Remove every configured role (it asks you to confirm).", "**Rename channel** - Change the name of the **#captcha** channel.", "**Rename role** - Change the name of the **Unverified** role new members get on join."]}, {"h": "Check the status", "p": ["`/captcha status` shows the current CAPTCHA configuration."]}, {"h": "Notes", "ul": ["Roles with dangerous permissions (like Administrator, Manage Server, Manage Roles, Kick/Ban Members) are skipped, and the bot tells you which permissions to remove.", "Disabling CAPTCHA asks for confirmation first, since it deletes **#captcha**. Click **Continue** to go through with it or **Cancel** to leave CAPTCHA on.", "Disabling never removes the **Unverified** role from anyone still mid-verification. They stay locked out and can resume where they left off once you enable CAPTCHA again.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "honeypot", "name": "Honeypot", "title": "Honeypot", "sub": "A trap channel real members never use. Anyone who posts in it is sanctioned automatically.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. The server owner, admins and moderators are never sanctioned.", "sections": [{"h": "How it works", "ul": ["Hacked accounts and spam bots post in every channel without reading, so anyone who posts in the honeypot is sanctioned automatically.", "A warning message is posted and pinned in the honeypot channel so real members know not to post there.", "The user is sent a DM explaining that their account is probably compromised and how to secure it.", "Anyone with Administrator, Manage Server, Ban Members, Kick Members, Manage Messages or Timeout Members is never sanctioned."]}, {"h": "Actions", "ul": ["`softban` - Ban then unban, which removes the user and their recent messages (default).", "`ban` - Permanently ban the user.", "`kick` - Kick the user and delete their recent messages.", "`timeout` - Timeout the user for 24 hours and delete their recent messages."]}, {"h": "Quick setup", "ol": ["Run `/configure` and pick **Honeypot**.", "Press **Create the honeypot channel** to make `#do-not-post` and turn the honeypot on right away, or pick an existing, unused channel in the dropdown.", "If you picked an existing channel, press **Module disabled** to turn the honeypot on.", "Press **Edit values** to choose the action and how many hours of messages to delete.", "Test it with a normal member account (admins and moderators are exempt)."]}, {"h": "Panel buttons", "ul": ["**Module enabled / disabled** - Turn the honeypot on or off. A channel must be set first.", "**Link to come back** - Send a one-use, 7-day invite to the user so a recovered account can rejoin (only used with `softban` and `kick`).", "**Edit values** - Change the action and the hours of messages deleted.", "**Create the honeypot channel** - Create `#do-not-post` and enable the honeypot.", "**Channel dropdown** - Choose an existing text channel as the honeypot.", "**Log channel dropdown** - Choose where every catch is logged.", "**Back** - Return to the `/configure` menu."]}, {"h": "Notes", "ul": ["The honeypot is **off** until you enable it. Creating the channel with the button enables it automatically.", "Only pick a channel nobody uses, because everyone who posts there is sanctioned.", "Messages deleted can be set from 0 to 168 hours (7 days).", "A log channel is optional but recommended, so you can see who was caught and whether the action worked.", "AntiSpam needs **Ban Members** (softban/ban), **Kick Members** (kick) or **Timeout Members** (timeout), and its role must be above the user's highest role. **Manage Messages** is needed to delete messages for kick/timeout, **Create Invite** for the come back link, and **Manage Channels** to create the channel.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "msgfilter", "name": "Duplicate Filter", "title": "Duplicate Filter", "sub": "Catches the same message posted again and again, and deletes the repeats.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Whitelisted users and roles are exempt.", "sections": [{"h": "How it works", "ul": ["Duplicate filtering helps prevent spam by blocking repeated messages.", "The **interval** is the number of minutes a repeated message counts as a duplicate, timed from the moment the original message was sent.", "**Example:** with an interval of `2`, if you send the same message again **within 2 minutes** of the original, it gets flagged and deleted. If you wait until the 2 minutes pass, you can send that same message again without it being flagged.", "**Identical messages allowed** is how many times the same message can be sent within the interval before it gets flagged. With `2`, the same message can be sent 2 times, and the **3rd** is flagged.", "If you never set an interval, the default is **1 minute**. The default for identical messages allowed is **1**, so the 2nd identical message is flagged."]}, {"h": "How to use it", "p": ["Open `/configure` → **Duplicate Filter**."], "ul": ["**Enable / Disable** - Turn duplicate message filtering on or off.", "**Set interval & limit** - Opens a form with the two values below.", "**Interval** - How many **minutes** (1 to 1440) a repeated message counts as a duplicate.", "**Identical messages allowed** - How many times the same message can be sent within the interval (1 to 20) before it gets flagged.", "**Whitelist** - Exempt users and roles from the filter, remove them again, and see who is whitelisted."]}, {"h": "Notes", "ul": ["AntiSpam needs the **Manage Messages** permission to delete duplicates.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "filterword", "name": "Filter Words", "title": "Filter Words", "sub": "Blocks the words and phrases you choose.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Whitelisted users and roles bypass the filter.", "sections": [{"h": "How it works", "ul": ["You build a list of words or phrases. Messages that contain them are blocked.", "Filtered words are detected regardless of case.", "Whitelisted users and roles bypass filtering."]}, {"h": "How to use it", "p": ["Open `/configure` → **Filter Words**."], "ul": ["**Add word** - Opens a form to add a word or phrase to the filter.", "**Remove word** - Remove a word from the filter.", "**View all words** - See every filtered word.", "**Log channel** - Choose where filtered word logs go in the dropdown, or press **Remove log channel**.", "**Whitelist** - Pick users and roles that bypass the filter, remove them again, and see who is whitelisted."]}, {"h": "Notes", "ul": ["Make sure the bot has the `Manage Messages` permission.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "linknotifier", "name": "Link Notifier", "title": "Link Notifier", "sub": "Get notified whenever a member posts a link, and delete the ones you don't want.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Whitelisted members' links are logged but never deleted.", "sections": [{"h": "How it works", "ul": ["Every link a member posts is logged in the channel you pick.", "With **Auto delete** on, the link message is deleted automatically right after it's logged.", "With the **Link filter**, a message containing a filtered link is deleted."]}, {"h": "How to use it", "p": ["Open `/configure` → **Link Notifier**."], "ul": ["**Log channel** - Choose the channel where links are logged in the dropdown. You must pick a channel when enabling. If you don't, the bot will warn you to choose one.", "**Enable / Disable** - Turn the Link Notifier on or off. No channel is needed to disable it.", "**Auto delete: Off / On** - Press it to switch. When it's on, the link message is deleted automatically right after it's logged, and the **Delete** button on the log entry is greyed out. The bot needs **Manage Messages** for this to work.", "**Whitelist** - Pick members whose links are still logged, but never auto-deleted or removed by the Link Filter. Remove them again with the other dropdown, and see who's whitelisted.", "**Link filter** - Press it to add or remove links by typing them (`https://` or `http://` links, a plain address like `example.com`, `localhost` and `user@host` all work; an entry with spaces is matched as plain text). A message containing a filtered link is deleted, and so are pages under it and its `http` / `www` versions. While the Link Filter has links, **Auto delete** is greyed out and off, because the filter already deletes them. Administrators and whitelisted members are exempt. The bot needs **Manage Messages**."]}, {"h": "Notes", "ul": ["Only **one channel** can have the Link Notifier active at a time. If you try to enable it in a different channel while it's already running, the bot tells you which channel it's enabled in. Disable it there first, then enable it in the new channel.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "appeals", "name": "Appeals", "title": "Appeals", "sub": "Members can appeal a ban or timeout. Staff accept or deny it in a private channel.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Deciding an appeal needs **Ban Members** (bans) or **Timeout Members** (timeouts), or **Administrator**.", "sections": [{"h": "How it works", "ol": ["A member is banned or timed out and AntiSpam DMs them an **Appeal this punishment** button.", "They press it and answer two questions: why they were punished, and why it should be lifted.", "The appeal is posted in your review channel with **Accept** and **Deny** buttons.", "A moderator decides. **Accept** unbans the member or removes the timeout. **Deny** can include a reason that is sent to the member.", "The member gets a DM with the result when Discord allows it. After an accepted ban, AntiSpam also tries to create a single-use invite (valid for 7 days) so they can come back."]}, {"h": "Quick setup", "ol": ["Create a private staff channel like `#appeals` and give **AntiSpam** **View Channel**, **Send Messages** and **Embed Links** there.", "Run `/configure`, pick **Appeals** and choose that channel as the review channel.", "Check that the page's **Status** says **Active** (or run `/appeals status`)."]}, {"h": "On the Appeals page", "ul": ["**Review channel** - Choose the private staff channel where appeals are posted.", "**Enable Appeals / Disable Appeals** - Turn the appeals system on or off.", "**Timeout buttons: On / Off** - Switch the automatic Appeal button on timeouts. Ban buttons stay on.", "**Set cooldown** - How many hours a member must wait between appeals (0 to 720, 0 = none).", "**Pending appeals** - List appeals waiting for a decision, with links to them."]}, {"h": "Who gets the Appeal button", "ul": ["**Timeouts** - Every timeout, whoever or whatever applies it, including timeouts given directly in Discord.", "**Bans** - `/ban`, the anti-spam ban, the Link Notifier **Ban** button, the Join Logs **Ban** button (member still in the server) and the honeypot ban.", "**No button** - Kicks, softbans, and bans made directly in Discord or by Guard and Raid Shield."]}, {"h": "Rules", "ul": ["Each punishment can only be appealed **once**.", "A member must wait the **cooldown** between appeals (default **24** hours, set it to `0` for no cooldown).", "The button stops working **30 days** after the punishment.", "A ban or timeout that already ended can't be appealed.", "Only one moderator can decide an appeal. A second click is told it was already decided."]}, {"h": "Check the status", "p": ["`/appeals status` shows if appeals are active, the review channel, the cooldown and how many appeals are pending, accepted and denied."]}, {"h": "Notes", "ul": ["Appeals do nothing until a review channel is set. Until then members just get the normal punishment DM with no button.", "Members with closed DMs can't get the button.", "A banned member usually shares no server with AntiSpam, so the result DM may not reach them. The moderator is told when that happens and gets the invite to send.", "AntiSpam needs **Ban Members** and **Moderate Members**, and its role must be above the member, or **Accept** fails and the appeal stays pending.", "Buttons keep working after a restart.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "warndecay", "name": "Warn Decay", "title": "Warn Decay", "sub": "Warnings expire after the number of days you set, so old mistakes stop counting.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Decay is off until an admin enables it.", "sections": [{"h": "How it works", "p": ["Without Warn Decay, a warning stays on a member's record until a moderator removes it."], "ul": ["Every warning gets a countdown from the moment AntiSpam first notices it, within a minute of it being given.", "When a warning is older than your chosen number of days, it expires and the member's warning count goes down by **1**.", "The warning limit only counts warnings that haven't expired yet.", "**Example** with 30 days: a member is warned on Jan 1, Jan 20 and Feb 5. On Feb 5 the Jan 1 warning has expired, so they have **2** warnings, not 3.", "Warnings from `/warn`, the anti-spam **Warn** punishment and the Link Notifier **Warn** button all share one count, and decay applies to that count.", "`/remove-warn` still works as before. When a moderator removes warnings, the newest ones are dropped from the countdown and the oldest keep counting down."]}, {"h": "Quick setup", "ol": ["Run `/configure`, pick **Warn Decay** and press **Enable Warn Decay**.", "Enter how many days a warning should last, for example `30`.", "Check that the page's **Status** says it is on (or run `/warndecay status`).", "Pick a member in the lookup dropdown whenever you want to see their countdowns."]}, {"h": "On the Warning Decay page", "ul": ["**Enable Warn Decay / Disable Warn Decay** - Turn decay on or off. When you enable it, a form asks how many days a warning lasts (1 to 365).", "**Set period** - Change how many days a warning lasts.", "**Member lookup** - Pick a member in the dropdown to see when each of their warnings expires."]}, {"h": "Check the status", "p": ["`/warndecay status` shows if decay is on, how many warnings are counting down and when the next one expires."]}, {"h": "Notes", "ul": ["When you enable it, warnings members already have start counting down from that moment.", "Using a shorter period expires older warnings within a minute. A longer period gives every warning more time.", "Disabling turns decay off and clears the countdowns. Warnings then stay until a moderator removes them, and enabling again restarts the countdowns.", "Warn Escalation steps (by default a softban at **6** warnings) apply to the count that is left after decay.", "Members are not notified when a warning expires."]}]}, {"id": "warnsteps", "name": "Warn Escalation", "title": "Warn Escalation", "sub": "Choose what happens when a member's warning count reaches a number.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`.", "sections": [{"h": "How it works", "p": ["For example: **3 warnings = timeout**, **5 = kick**, **7 = ban**."], "ul": ["Warnings from `/warn`, the anti-spam **Warn** punishment and the Link Notifier **Warn** button all share one count, and every one of them follows your steps.", "A step runs **once**, when a member's count reaches its number. With steps at 3 and 5, a member who has 4 warnings gets nothing new until they reach 5.", "The member gets a DM that says what happened, and when **one more warning** will trigger a step.", "**Kick**, **Softban** and **Ban** remove the member. A softban also deletes their recent messages, but they can rejoin.", "After the **last** step, if it is a kick, softban or ban, the member's warnings are reset to 0. Earlier steps keep the count, so the next step can still be reached when the member comes back.", "A **Ban** step adds an **Appeal** button to the member's DM when appeals are set up.", "If the last step is a kick, softban or ban and it fails (for example the bot's role is too low), the member keeps their warnings and the next warning tries it again. Other steps are not retried."]}, {"h": "Quick setup", "ol": ["Run `/configure` and pick **Warn Escalation**.", "Pick **Timeout** in the first dropdown, enter `3` and `1h`.", "Pick **Kick** and enter `5`.", "Pick **Ban** and enter `7`."]}, {"h": "On the Warn Escalation page", "ul": ["**Add a step** - Pick an action (Timeout, Kick, Softban or Ban) in the first dropdown. A form asks for the number of warnings (1 to 50) and, for a timeout, how long it lasts, like `30m`, `12h` or `3d` (up to 28 days). If that number already has a step, the step is changed.", "**Remove a step** - Pick it in the second dropdown.", "**Reset to default** - Remove all your steps and go back to a **softban** at **6** warnings.", "You can have up to 10 steps."]}, {"h": "Notes", "ul": ["Until you change something, every server uses the default: a **softban** at **6** warnings.", "Adding your first step **replaces** the default. Add a step at 6 if you want to keep it.", "Having no steps is allowed. Warnings are then only counted and nothing happens automatically.", "AntiSpam needs **Timeout Members**, **Kick Members** or **Ban Members** for the steps you use, and its role must be above the member's. The server owner can't be punished, and members with Administrator can't be timed out.", "With **Warn Decay** on, warnings that expire lower the count, so a member can reach a step again later."]}]}, {"id": "joinlogs", "name": "Join Logs", "title": "Join Logs", "sub": "A staff-channel message for every join, with Kick and Ban buttons.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`, and only Administrators can use the buttons.", "sections": [{"h": "How it works", "p": ["**Join Logs** posts a message in a staff channel every time someone joins your server. It shows the account's details and has buttons to **kick or ban** them on the spot, so you can deal with suspicious accounts and bots quickly."], "ul": ["**New Member Joined!** for people - their username and tag, ID and how old the account is, with **Kick Member** and **Ban Member** buttons.", "**Bot Added** for bots - the same details with **Kick Bot** and **Ban Bot** buttons.", "**Trusted Bot Joined!** for bots on your trusted list - details only, no buttons."]}, {"h": "Quick setup", "ol": ["Create a private staff channel like `#join-logs` and give **AntiSpam** **View Channel**, **Send Messages** and **Embed Links** there.", "Run `/configure`, pick **Join Logs** and choose that channel.", "Run `/server status` to check that the join logs channel is shown."]}, {"h": "On the Join Logs page", "ul": ["**Log channel** - Choose the channel where join logs are posted in the dropdown. Choosing a channel again simply changes it.", "**Disable join logs** - Stop posting join logs (it asks you to confirm)."]}, {"h": "The buttons", "ul": ["**Kick** removes the member, who can rejoin with an invite. It only works while they are still in the server.", "**Ban** bans them, even if they already left. If appeals are set up and they are still in the server, they get an **Appeal** button in their DM first.", "Only the admin who pressed a button sees the result, and the buttons stay on the log so another admin can use them too."]}, {"h": "Notes", "ul": ["Join logs are **off** until an admin chooses a log channel in `/configure`. With no setup, nothing is posted.", "If the channel is deleted or AntiSpam can't send there, the log goes to the system channel, then to the first channel AntiSpam can send in. Keep the permissions right to keep your logs private.", "Bots that Anti-Bot kicks are reported in the Anti-Bot log instead of here.", "The buttons need **Kick Members** and **Ban Members**, and AntiSpam's role must be above the member.", "Join logs don't change verification: new members still go through the CAPTCHA.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "autorespond", "name": "Auto Respond", "title": "Auto Respond", "sub": "Replies automatically to the trigger words or phrases you add.", "who_title": "Who can use this feature?", "who": "Everything on this page requires Administrator permissions.", "sections": [{"h": "How it works", "ul": ["Auto Respond replies whenever a trigger word or phrase is detected.", "It works in specific channels and server-wide (if no channel is set)."]}, {"h": "How to use it", "p": ["Open `/configure` → **Auto-Respond**."], "ul": ["**Add auto-response** - Opens a form with the trigger word/phrase and the reply.", "**Channel scope** - A new auto-response works in all channels by default. Use the dropdown to limit the next new one to a single channel, and the **All channels** button to switch back.", "**Remove** - Pick an auto-response from the dropdown to remove it.", "**Clear all** - Remove all auto responses from the server.", "**Prev / Next** - Page through the active auto responses."]}, {"h": "Notes", "ul": ["Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "sticky", "name": "Sticky Messages", "title": "Sticky Messages", "sub": "Keeps a message at the bottom of a channel.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`.", "sections": [{"h": "How to use it", "p": ["Open `/configure` → **Sticky Messages**. A sticky message stays at the bottom of a channel."], "ul": ["**Set text sticky here** - Create a sticky message in the channel where you opened `/configure`.", "**Set embed sticky here** - Create a sticky embed (title and description) in that channel.", "**Remove** - Pick a sticky message in the dropdown to remove it, in this channel or another one.", "**Clear all** - Remove all sticky messages from the server.", "The page lists the sticky messages in your server. Use **Prev / Next** to page through them."]}, {"h": "Notes", "ul": ["Setting a new sticky in a channel that already has one replaces it.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "tempchannel", "name": "Temporary Channels", "title": "Temporary Channels", "sub": "Creates temporary voice or text channels with a timer and access controls.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. You need **Manage Messages** to use the buttons inside a temporary channel.", "sections": [{"h": "How it works", "ul": ["Temporary channels auto-delete when their timer expires.", "Pausing stores the remaining time until resumed."]}, {"h": "How to use it", "p": ["Open `/configure` → **Temp Channels**."], "ul": ["**Create new** - Choose how long the channel lasts (in minutes) and, if you like, a name. Leave the name blank for an automatic one.", "**Who can see it** - On the create page, optionally pick members, roles and a category. Pick nothing for a public temporary channel. Pick members and/or roles to make it private to them.", "**Extend selected** - Pick a temporary channel in the dropdown, then add extra minutes to its life.", "**Delete selected** - Manually delete the picked temporary channel.", "The page lists all active temporary channels. Use **Prev / Next** to page through them."]}, {"h": "Buttons inside channels", "ul": ["**Pause** - Pause the deletion timer.", "**Resume** - Resume the timer with remaining time.", "**Show Time** - Show how much time is left before deletion.", "**Delete** - Delete the channel immediately."]}, {"h": "Notes", "ul": ["Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "forms", "name": "Forms", "title": "Forms", "sub": "Build forms members fill in, then read the answers in Discord or export them.", "who_title": "Who can use this feature?", "who": "Administrators set it up in `/configure`. Only an administrator can accept or deny an answer.", "sections": [{"h": "How it works", "p": ["**Forms** work like Google Forms. You build a form with your own questions, post it in a channel, and every submission arrives as an **answer sheet** you can read in Discord or export to a spreadsheet."]}, {"h": "Quick setup", "ol": ["Run `/configure`, pick **Forms** and press **New form**, or **From template** to start from a ready-made form.", "Add your questions with the **Add a question** menu (a template already has its questions).", "Pick the **answer sheet channel** (keep it private, it shows people's answers).", "Press **Post form** and choose where members will see it."]}, {"h": "How members answer", "ul": ["They press **Fill out form**. Only they can see the steps.", "Short answer, paragraph, number, email and link questions open in a pop-up with up to 5 boxes. Other kinds each use a menu.", "A question with a **Show only if...** rule only appears when an earlier answer calls for it.", "A review page shows all answers. Nothing is sent until they press **Submit**.", "If they leave it for about 14 minutes it times out and they start again.", "If **Edit & withdraw** is on, they can change or withdraw their answers until staff review them."]}, {"h": "On the Forms page", "ul": ["**New form** - A pop-up asks for a name (only you see it), the title members see and an optional description.", "**From template** - Start from a ready-made form: **Staff application**, **Bug report**, **Suggestion**, **Appeal**, **Member report**, **Feedback survey**, **Support request**, **Partnership request**, **Role request**, **Introduction**, **Event signup**, **Staff leave notice**, **Report a staff member**, **Content creator application**, **Beta tester application**, **Giveaway entry** or **Looking for group**. You can change anything before you post it.", "**Pick a form** in the menu to edit it. You can have up to 10 forms per server."]}, {"h": "On a form's page", "ul": ["**Add a question** - Pick a question type. A pop-up asks for the question and whether it is required.", "**Answer sheet channel** - Where every submission is sent as a message.", "**Edit info** - Change the name, title and description.", "**Manage questions** - Pick a question to edit it, move it up or down, remove it, or make it appear only for some members with **Show only if...**.", "**Close form / Open form** - Stop or start taking answers. The posted form's button greys out while it is closed.", "**After submitting** - Opens a page with the thank-you message, the confirmation DM, edit & withdraw and **One reply per member**.", "**Auto-close** - Close the form at a deadline and/or after a number of responses.", "**Post form** - Pick a channel and the bot posts the form with a **Fill out form** button. Press **Panel look** there to change how it looks.", "**Send to a user** - Pick one member and the bot sends them the form in their DMs. A form with a member, role or channel question can't be sent this way.", "**Discussion threads** - On: every answer sheet gets a thread where staff can talk about it. Off: no threads.", "**Duplicate form** - Makes a copy named **Copy of ...** with the same title, description, questions, settings and panel look. The responses, the posted message and auto-close are not copied.", "**Responses** - Read the 25 newest answer sheets (each shows Pending, Accepted or Denied). You can accept or deny one there, or delete it so that member can answer again.", "**Results summary** - The total number of responses, how many times each option of a multiple choice, checkbox or Yes / No question was picked, and the average of each linear scale question.", "**Export CSV** - Download every response as a file for Google Sheets or Excel.", "**Delete form** - Removes the form, its saved answers, its uploaded files and the posted message."]}, {"h": "Question types", "ul": ["**Short answer** and **Paragraph** - Written answers, with an optional minimum and maximum length.", "**Number** - Only a number is accepted, with an optional lowest and highest value.", "**Email address** - Only a valid email address is accepted.", "**Link (URL)** - Only a web link that starts with `http://` or `https://` is accepted.", "**Multiple choice**, **Checkboxes**, **Linear scale** and **Yes / No** - The member picks from a menu.", "**Member picker**, **Role picker**, **Channel picker** - The member picks a member, role or channel from Discord's own menu. These only work inside the server, so a form that has one can't be filled in from a DM.", "**File upload** - The member uploads up to the number of files you set (1 to 10). Each file can be up to 8 MB, and programs and scripts (like `.exe`) are refused.", "An optional question can be left empty."]}, {"h": "After submitting", "ul": ["**Thank-you message** - What the member sees after pressing **Submit**, up to 500 characters. Write `{user}`, `{form}` or `{response}` to fill in their name, the form's title and the response number.", "**One reply per member** - On: each member can answer once. Off: as many times as they like.", "**Confirmation DM** - Off by default. On: the member gets a copy of their answers in their DMs.", "**Edit & withdraw** - Off by default. On: until staff accept or deny a response, the member can change it or take it back."]}, {"h": "Accept or deny an answer", "ul": ["Every answer sheet in the answer sheet channel has **Accept** and **Deny** buttons. They work after a restart.", "A pop-up lets you type what the member should be told. Leave it empty to send a short default message.", "The member gets your message in their DMs. If their DMs are off, you are told and given your message back so you can send it yourself.", "A response can only be decided once. The sheet then shows who decided."]}, {"h": "Limits", "ul": ["Up to 20 questions per form.", "Questions answered in a pop-up (Short answer, Paragraph, Number, Email, Link) can be up to 45 characters long. The other kinds can be up to 200.", "Answers: up to 300 characters for Short answer and 1000 for Paragraph. Email up to 254, link up to 500.", "Multiple choice and Checkboxes take 2 to 25 options. A Linear scale goes from 1 up to a number from 2 to 10."]}, {"h": "Notes", "ul": ["AntiSpam needs **View Channel**, **Send Messages** and **Embed Links** in the answer sheet channel and the channel you post in. For forms with file questions it also needs **Attach Files** in the answer sheet channel.", "Answers already sent keep the wording of the question even if you edit or remove it later.", "Everyone who can see the answer sheet channel can read the answers and open the uploaded files, and the CSV file contains member IDs and usernames.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "purge", "name": "Purge", "title": "Purge", "sub": "Bulk-deletes messages: all of them, or only those from one user, containing text, or with attachments, embeds or bots.", "who_title": "Who can use this feature?", "who": "You need **Manage Messages** to use these commands. `/purge list` is admin only.", "sections": [{"h": "Commands", "ul": ["`/purge all` - Delete all messages in the channel.", "`/purge user user:<member>` - Delete all messages from a specific user.", "`/purge contains text:<search text> amount:[1-500] message_id:[optional]` - Delete messages containing specific text.", "`/purge attachments amount:[1-500] message_id:[optional] user:[optional]` - Delete messages with images, files, or attachments.", "`/purge embeds amount:[1-500]` - Delete messages containing embeds.", "`/purge bots bot_user:[optional] amount:[1-500]` - Delete messages from bots.", "`/purge status` - Check if there's an active purge in this channel.", "`/purge list` - List all active purges (**admin only**)."]}, {"h": "Notes", "ul": ["All deletions are permanent and **cannot be undone**.", "Only one purge operation can run **per channel** at a time.", "Messages older than **14 days** are deleted individually (slower).", "`message_id` starts the purge from that message (deletes newer ones).", "`user` filters purges by user, and `bot_user` targets specific bots for deletion.", "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality."]}]}, {"id": "moderation", "name": "Moderation", "title": "Moderation", "sub": "Warn, timeout, kick or ban members, and check warnings.", "who_title": "Good to know", "who": "Make sure **AntiSpam** has the highest role, it's required to secure your server at the highest quality.", "sections": [{"h": "Commands", "ul": ["`/warn [@user] [reason]` - Issue a warning to a user. Reaching a **Warn Escalation** step runs its action.", "`/check warn user:[@user]` - Check how many warnings a user has received via `/warn`.", "`/check-my warn` - Check your own anti-spam warnings.", "`/remove-warn user [@user] [counts]` - Reduce a user's warning count.", "`/timeout user [@user] [duration] [reason]` - Apply a timeout to a user.", "`/remove timeout [@user]` - Remove a user's timeout.", "`/kick [@user]` - Kick a user from the server.", "`/ban [@user]` - Ban a user from the server."]}, {"h": "Other commands", "ul": ["`/configure` - Open the configuration dashboard to set up the bot's features (Administrator only).", "`/help` - Get help, with a category for each feature.", "`/server status` - Displays the current server configuration and status.", "`/disable-all antispam` - Turn off anti-spam protection for the server.", "`/info` - Get bot and system information.", "`/ping` - Check the bot's latency and whether it is keeping up.", "`/invite` - Get the bot's invite link.", "`/report [user@gmail.com] [complain]` - Report bugs on the bot to improve it."]}, {"h": "Status commands", "ul": ["`/antispam status`, `/captcha status`, `/guard status`, `/shield status`, `/appeals status` and `/warndecay status` each show how that feature is set up."]}]}, {"id": "ai", "name": "AI Chat", "title": "AI Chat", "sub": "Ask an AI a question with a free model. Your chats are saved so you can continue, rename or delete them.", "who_title": "Who can use this feature?", "who": "These commands are open to **everyone**, no permissions needed.", "sections": [{"h": "Commands", "ul": ["`/ask prompt:<question> [model] [chat] [private] [new_chat]` - Ask the AI a question.", "`/chats list` - See your saved chats.", "`/chats rename chat:<chat> name:<new name>` - Rename a saved chat.", "`/chats delete chat:<chat>` - Delete one saved chat.", "`/chats clear` - Delete all of your saved chats."]}, {"h": "Options of /ask", "ul": ["`prompt` - Your question (up to 2000 characters).", "`model` - Start typing to search the free models. The model you pick is remembered next time. If you leave it empty, your last pick (or a Qwen model) is used.", "`chat` - Continue one of your saved chats. Pick it from the list, or choose **Start a new chat**.", "`private` - Only you can see the answer.", "`new_chat` - Start a brand-new chat. Your old chats stay saved."]}, {"h": "How chats work", "ul": ["Every `/ask` is saved in a chat. Without any options, `/ask` continues your latest chat if you used it in the last 30 minutes, otherwise it starts a new one.", "To go back to an older chat, use the `chat` option and pick it from the list.", "The AI remembers the last 5 messages of the chat, so you can ask follow-ups like `explain that more simply`."]}, {"h": "Examples", "ul": ["`/ask prompt:What is a Discord webhook?`", "`/ask prompt:Explain that more simply` (continues your latest chat)", "`/ask prompt:Tell me a joke new_chat:True` (starts a new chat)", "`/chats rename chat:<pick a saved chat> name:Python help`"]}, {"h": "Notes", "ul": ["You can send **600 prompts per day** in total (all servers together). The limit resets at 00:00 UTC, and prompts that fail don't count.", "Only one prompt at a time: wait for the answer before asking again.", "You can keep up to **10 chats** (50 messages each). When you start one more, your least recently used chat is removed.", "Chats are deleted after **30 days** without use. Your prompts and answers are stored only so you can continue a chat. Delete them any time with `/chats delete` or `/chats clear`.", "AI answers can be wrong, so double-check anything important."]}]}, {"id": "coowners", "name": "Co-Owners", "title": "Co-Owners", "sub": "Trusted admins the server owner picks to help run the owner-only pages.", "who_title": "Who can use this feature?", "who": "Only the server owner sees this page.", "sections": [{"h": "How it works", "p": ["The owner decides, for each co-owner, exactly which pages they get: **Anti-Bot**, **Guard** and **Raid Shield**."], "ul": ["Up to **5** co-owners per server, and a bot can't be one.", "A co-owner who leaves, is kicked or is banned is removed automatically.", "If the server is **transferred** to a new owner, every co-owner stops counting at once and the new owner starts with an empty list."]}, {"h": "How to use it", "p": ["Open `/configure` → **Co-Owners (owner only)**. Nobody else sees this option."], "ul": ["**Add a co-owner** - Pick an admin in the first dropdown. New co-owners start with **every** page.", "**Remove a co-owner** - Pick them in the second dropdown.", "**Choose what a co-owner can use** - Pick a co-owner in the third dropdown, then tick the pages they get: **Anti-Bot**, **Guard** and **Raid Shield**. You can tick none. Your choice is saved right away.", "The page lists every co-owner and the pages they have. **Refresh** reloads it and **Back** returns to the menu."]}, {"h": "What a co-owner can do", "ul": ["Use **only** the pages you ticked for them. A page you leave off is hidden from them in `/configure`, and its commands and buttons stop working for them (`/guard ...`, `/shield ...` and the raid report buttons).", "**Anti-Bot** - turn it on or off and set its log channel.", "**Guard** - turn it on or off, trusted list, log channel, backups and restores.", "**Raid Shield** - turn it on or off, exempt bots, report channel and the raid report buttons (Allow, Kick, Ban).", "Every co-owner is **trusted** by Guard and Raid Shield, so their own actions are never counted as an attack, whatever pages they have."]}, {"h": "What a co-owner can't do", "ul": ["Add or remove co-owners, or change what any co-owner can use.", "Open `/configure` without the **Administrator** permission. Give it to them first."]}, {"h": "Notes", "ul": ["Everything on the Co-Owners page is private, only you see it.", "Turning a page off for someone does not remove them from Guard's trusted list. Use the trusted list on the Guard page to remove them there too.", "The Guard and Raid Shield pages can turn protection off and restore backups, so only pick admins you trust with them."]}]}, {"id": "auditlog", "name": "Audit Log", "title": "Audit Log", "sub": "Who changed what on Guard, Raid Shield, Anti-Bot and Co-Owners.", "who_title": "Who can use this feature?", "who": "Only the **real server owner** can open it. A co-owner never can.", "sections": [{"h": "How it works", "p": ["The Audit Log records every change made on the **Guard**, **Raid Shield**, **Anti-Bot** and **Co-Owners** pages: who did it, when, which setting, and the old and new value."]}, {"h": "What is logged", "ul": ["**Guard** - on/off, trusted list, log channel, Backup now, Restore, Delete backup and password changes (never the password itself).", "**Raid Shield** - on/off, exempt bots, report channel.", "**Anti-Bot** - on/off, log channel.", "**Co-Owners** - added, removed, pages changed, and the server being transferred to a new owner.", "**Security** - wrong Guard passwords and recovery answers, and being blocked from a page."]}, {"h": "How to use it", "p": ["Open `/configure` → **Audit Log (owner only)**."], "ul": ["Entries are shown newest first, 5 per page. **Previous** and **Next** turn the page.", "A warning sign marks a **risky** change, like turning protection off, trusting someone or restoring a backup.", "**Show entries from** - pick one page (Guard, Raid Shield, Anti-Bot, Co-Owners), the log's own changes, or **Security events** (wrong passwords and blocked access).", "**Risky only**, **Co-owners only** and the **time button** (all time, 24 hours, 7 days, 30 days) narrow the list. **Search** finds a name, a user ID or a word. **Reset filters** clears them all.", "**Open an entry** - pick one in the dropdown to see its details and, when possible, **Undo this change**.", "**Export** - sends the entries you see (the filters apply) as a `.txt` and a `.csv` file, only to you.", "**Settings** - alerts, the weekly summary and how long entries are kept.", "**Clear log** - deletes every entry after you confirm. One entry stays behind that says you cleared it."]}, {"h": "Undo", "ul": ["Works only while the setting still has the value that change gave it, so a newer change is never overwritten.", "It can turn Guard, the Raid Shield or Anti-Bot back **on**, remove someone from a trusted or exempt list, put a log channel back, remove a co-owner who was added and give a co-owner their old pages back.", "It never turns protection **off** from here. Use the page itself for that, so the Guard password is still asked.", "Undoing is written to the log too."]}, {"h": "Alerts", "ul": ["When someone who is **not you** does something risky, or types a wrong Guard password, you get a **DM** (switch it off in **Settings**) and, if you picked one, a message in a **private alert channel**.", "Pick a channel only you and people you trust can read.", "**Weekly summary** *(off by default)* - a DM once a week with how many changes there were."]}, {"h": "Notes", "ul": ["Only changes made in `/configure` are logged. A co-owner who leaves or is banned is removed automatically and is not logged.", "Backup now and Restore are logged as **used**. The log can't tell if Guard then refused to finish them.", "By default the newest **500** entries are kept. Change that in **Settings**.", "If the server is **transferred**, the new owner can read the old log."]}]}]};

// --- Header height (for the sticky sidebar and bar) ---

const hdr = document.querySelector("header");
function setHdr(){ document.documentElement.style.setProperty("--hdr", hdr.offsetHeight + "px"); }
setHdr(); window.addEventListener("resize", setHdr); window.addEventListener("load", setHdr);
if(window.ResizeObserver) new ResizeObserver(setHdr).observe(hdr);
} catch(e) { console.error("Header sizing failed:", e); }

const ALL = [DATA.quick].concat(DATA.pages);
const BY_ID = {}; ALL.forEach(p => { BY_ID[p.id] = p; });
const ALIAS = { modules: "antispam", commands: "moderation" };   // links from older versions of the site
const DEFAULT = "antispam";

const doc = document.getElementById("doc");
const side = document.getElementById("docsSide");

const groupList = document.getElementById("docsGroupList");
const tocBtn = document.getElementById("tocBtn");
const tocList = document.getElementById("tocList");
const mobile = window.matchMedia("(max-width: 860px)");
let current = DEFAULT;

function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return s;
}

// sidebar items
groupList.innerHTML = DATA.pages.map(p =>
  `<button type="button" class="docs-item" data-pane="${p.id}">${esc(p.name)}</button>`).join("");
const paneBtns = document.querySelectorAll("[data-pane]");

// copy-markdown widget (one instance, moved under the subtitle of whatever page is open)
const copyWrap = document.createElement("div");
copyWrap.className = "copy-wrap";
copyWrap.innerHTML = `
  <div class="copy-pill">
    <button type="button" class="copy-main" id="copyMain">Copy markdown</button>
    <button type="button" class="copy-caret" id="copyCaret" aria-label="More options" aria-haspopup="true" aria-expanded="false" aria-controls="copyMenu"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17 4 8h16z"/></svg></button>
  </div>
  <div class="copy-menu" id="copyMenu">
    <button type="button" id="copyMenuCopy">Copy markdown</button>
    <button type="button" id="copyMenuDl">Download as .md</button>
  </div>`;
const copyMain = copyWrap.querySelector("#copyMain");
const copyCaret = copyWrap.querySelector("#copyCaret");
const copyMenu = copyWrap.querySelector("#copyMenu");

const BRIEF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>';

function pageHtml(p){
  let h = `<h1 class="docs-h">${esc(p.title)}</h1><p class="docs-sub">${inline(p.sub)}</p>`;
  h += `<div class="info"><div class="info-title">${esc(p.who_title)}</div><div class="info-row">${BRIEF}<p>${inline(p.who)}</p></div></div>`;
  p.sections.forEach(s => {
    h += `<h3 class="sec-h">${esc(s.h)}</h3>`;
    (s.p || []).forEach(t => { h += `<p class="body">${inline(t)}</p>`; });
    if(s.ul) h += `<ul class="sec-list">${s.ul.map(t => `<li>${inline(t)}</li>`).join("")}</ul>`;
    if(s.ol) h += `<ol class="sec-list">${s.ol.map(t => `<li>${inline(t)}</li>`).join("")}</ol>`;
  });
  return h;
}
function pageMarkdown(p){
  const out = ["# " + p.title, p.sub, "> **" + p.who_title + "**\n> " + p.who];
  p.sections.forEach(s => {
    out.push("## " + s.h);
    (s.p || []).forEach(t => out.push(t));
    if(s.ul) out.push(s.ul.map(t => "- " + t).join("\n"));
    if(s.ol) out.push(s.ol.map((t, i) => (i + 1) + ". " + t).join("\n"));
  });
  return out.join("\n\n") + "\n";
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    }catch(e2){ return false; }
  }
}
let copyTimer;
async function doCopy(){
  const ok = await copyText(pageMarkdown(BY_ID[current]));
  copyMain.textContent = ok ? "Copied!" : "Copy failed";
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { copyMain.textContent = "Copy markdown"; }, 1600);
}
function doDownload(){
  const blob = new Blob([pageMarkdown(BY_ID[current])], {type:"text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "antispam-" + current + ".md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function closeCopyMenu(){ copyMenu.classList.remove("open"); copyCaret.setAttribute("aria-expanded", "false"); }
function closeToc(){ tocList.classList.remove("open"); tocBtn.setAttribute("aria-expanded", "false"); }

copyMain.addEventListener("click", doCopy);
copyCaret.addEventListener("click", (e) => {
  e.stopPropagation(); closeToc();
  const open = copyMenu.classList.toggle("open");
  copyCaret.setAttribute("aria-expanded", open ? "true" : "false");
});
copyWrap.querySelector("#copyMenuCopy").addEventListener("click", () => { closeCopyMenu(); doCopy(); });
copyWrap.querySelector("#copyMenuDl").addEventListener("click", () => { closeCopyMenu(); doDownload(); });

function buildToc(){
  const heads = [...doc.querySelectorAll("h3")];
  tocList.innerHTML = "";
  heads.forEach(h => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = h.textContent;
    b.addEventListener("click", () => { closeToc(); h.scrollIntoView(); });
    tocList.appendChild(b);
  });
  tocBtn.style.display = heads.length ? "" : "none";
}
tocBtn.addEventListener("click", (e) => {
  e.stopPropagation(); closeCopyMenu();
  const open = tocList.classList.toggle("open");
  tocBtn.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", (e) => {
  if(!copyWrap.contains(e.target)) closeCopyMenu();
  if(!tocList.contains(e.target) && !tocBtn.contains(e.target)) closeToc();
});
document.addEventListener("keydown", (e) => { if(e.key === "Escape"){ closeCopyMenu(); closeToc(); } });

function setGroup(open){
  groupBtn.setAttribute("aria-expanded", open ? "true" : "false");
  groupList.hidden = !open;
}
groupBtn.addEventListener("click", () => setGroup(groupBtn.getAttribute("aria-expanded") !== "true"));

function showPane(id){
  id = ALIAS[id] || id;
  if(!BY_ID[id]) id = DEFAULT;
  current = id;
  const p = BY_ID[id];
  doc.innerHTML = pageHtml(p);
  doc.querySelector(".docs-sub").insertAdjacentElement("afterend", copyWrap);
  paneBtns.forEach(b => {
    const on = b.dataset.pane === id;
    b.classList.toggle("active", on);
    if(on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  document.title = p.title + " — See what it does — AntiSpam";
  closeCopyMenu(); closeToc(); buildToc();
  // keep the active item visible inside the sidebar (desktop)
  const active = document.querySelector(".docs-item.active");
  if(active && !mobile.matches && groupBtn.getAttribute("aria-expanded") === "true"){
    const top = active.offsetTop, bottom = top + active.offsetHeight;
    if(top < side.scrollTop || bottom > side.scrollTop + side.clientHeight){
      side.scrollTop = Math.max(0, top - side.clientHeight / 2);
    }
  }
}
function go(id){
  showPane(id);
  history.replaceState(null, "", "#" + current);
  window.scrollTo(0, 0);
  if(mobile.matches) setGroup(false);
}
paneBtns.forEach(b => b.addEventListener("click", () => go(b.dataset.pane)));
document.querySelectorAll('header a[href^="#"]').forEach(a => {
  const h = a.getAttribute("href");
  if(h.length < 2) return;
  a.addEventListener("click", (e) => { e.preventDefault(); go(h.slice(1)); });
});
function fromHash(){ showPane(location.hash.replace("#", "") || DEFAULT); }
window.addEventListener("hashchange", () => { fromHash(); window.scrollTo(0, 0); });
if(mobile.matches) setGroup(false);
fromHash();
} catch(e) { console.error("Docs wiring failed:", e); }

// --- Dropdown menu ---
try {
const menuBtn = document.getElementById("menuBtn");
const dropdownMenu = document.getElementById("dropdownMenu");

function openDropdown(){
  dropdownMenu.classList.add("open");
  menuBtn.setAttribute("aria-expanded", "true");
}
function closeDropdown(){
  dropdownMenu.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}
function toggleDropdown(e){
  e.stopPropagation();
  dropdownMenu.classList.contains("open") ? closeDropdown() : openDropdown();
}
menuBtn.addEventListener("click", toggleDropdown);
document.addEventListener("click", (e) => {
  if(!dropdownMenu.contains(e.target) && e.target !== menuBtn) closeDropdown();
});
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeDropdown(); });
dropdownMenu.querySelectorAll(".dropdown-item").forEach(a => a.addEventListener("click", closeDropdown));
window.addEventListener("scroll", closeDropdown, {passive:true});
} catch(e) { console.error("Dropdown wiring failed:", e); }


// --- Nav status dot ---
try {
(async () => {
  const dot = document.getElementById("navdot");
  try{
    const res = await fetch(API_BASE, {cache:"no-store"});
    if(!res.ok) throw new Error("bad response");
    const d = await res.json();
    dot.style.background = d.online ? "var(--ok)" : "var(--block)";
  }catch(e){ dot.style.background = "var(--muted)"; }
})();
} catch(e) { console.error("Status dot failed:", e); }
</script>
